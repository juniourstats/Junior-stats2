<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>junior stats</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7380;--bd:#dfe3e8;--pr:#e8590c;--ok:#2b8a3e;--no:#c92a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2126;--tx:#eceff3;--mut:#9aa3af;--bd:#333943}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2126;--tx:#eceff3;--mut:#9aa3af;--bd:#333943}
*{box-sizing:border-box;touch-action:manipulation}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:10px;max-width:640px;margin-inline:auto}
.nav{display:flex;gap:6px;margin-bottom:8px}
.nav button{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 4px;font-size:15px}
.nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.btn{border:0;background:var(--pr);color:#fff;border-radius:8px;padding:10px 14px;font-size:15px}
.btn.g{background:var(--card);color:var(--mut);border:1px solid var(--bd)}
.row{display:flex;gap:6px;margin:8px 0}
.row input{flex:1;min-width:0;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:10px;font-size:15px}
.row input.n{flex:none;width:64px}
.court{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.pc{position:relative;background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:6px 2px 4px;text-align:center;min-height:92px}
.pc.sel{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,var(--card))}
.pc.empty{display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--mut);border-style:dashed}
.pc .no{font-size:22px;font-weight:700}.pc .nm{font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pc .pt{font-size:11px;color:var(--mut);margin-top:2px}
.pc .sw{width:100%;border:0;border-top:1px solid var(--bd);background:none;color:var(--pr);font-size:17px;margin-top:3px;padding:2px}
.sub{background:var(--card);border:1px dashed var(--pr);border-radius:10px;padding:8px;margin:8px 0}
.sub h3{font-size:14px;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:18px;padding:8px 12px;font-size:14px}
.mode{display:flex;gap:6px;margin:10px 0 6px}
.mode button{flex:1;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px;font-size:15px}
.mode .on.p{border-color:var(--ok);color:var(--ok)}.mode .on.m{border-color:var(--no);color:var(--no)}
.who{font-size:15px;margin:6px 0}.who b{color:var(--pr)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ab{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;min-height:64px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.ab small{font-size:11px;color:var(--mut)}.ab span{font-size:14px;font-weight:600}.ab b{font-size:20px}
.ab.g{border-color:var(--ok)}.ab.r{border-color:var(--no)}
.pad.minus .ab{background:color-mix(in srgb,var(--no) 10%,var(--card))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:10px 0}
.pl{display:flex;gap:6px;align-items:center;margin:6px 0}
.pl input{min-width:0;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:8px;font-size:15px}
.pl input.n{width:54px}.pl input.m{flex:1}
.pl small{color:var(--mut);font-size:11px;width:34px}
.scr{overflow-x:auto}
table.t{border-collapse:collapse;font-size:12px;text-align:center;width:100%}
.t th,.t td{border:1px solid var(--bd);padding:5px 4px;white-space:nowrap}.t th{background:var(--bg)}
.t tr.tm td{font-weight:700;background:var(--bg)}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tot div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.tot span{display:block;font-size:12px;color:var(--mut)}.tot strong{font-size:20px}
#rep{display:none}
@media print{
 @page{size:A4 landscape;margin:10mm}
 body{background:#fff;color:#000;padding:0;max-width:none}
 body>*:not(#rep){display:none!important}
 #rep{display:block}
 #rep h1{font-size:18px;margin:0 0 4px}#rep .d{font-size:12px;margin-bottom:8px;color:#444}
 #rep table{width:100%;border-collapse:collapse;font-size:10px;text-align:center}
 #rep th,#rep td{border:1px solid #444;padding:4px 2px}#rep th{background:#eee}
 #rep tr.tm td{font-weight:700;background:#f3f3f3}
}
</style>
</head>
<body>
<div class="nav" id="nav"></div>
<div id="view"></div>
<div id="rep"></div>
<script>
const G=[["m2l","m2s","x2l","x2s","m3","x3","ftm","ftx","dr","or","as","st","pf","tdt","ttr"]];
const KEYS=G[0];
let S={players:[],court:[null,null,null,null,null],sel:null,tab:"live",mode:"+",subSlot:null,fname:"junior stats"};
try{const x=JSON.parse(localStorage.getItem("bara3em"));if(x&&Array.isArray(x.players))Object.assign(S,x)}catch(e){}
let cloudDoc=null,cloudT=null;
const save=()=>{
  const at=Date.now();
  try{localStorage.setItem("bara3em",JSON.stringify(S));localStorage.setItem("bara3em_at",String(at))}catch(e){}
  if(cloudDoc){clearTimeout(cloudT);cloudT=setTimeout(()=>{cloudDoc.set({json:JSON.stringify(S),at}).catch(()=>{})},700)}
};
const blank=()=>Object.fromEntries(KEYS.map(k=>[k,0]));
let _n=0;
const P=id=>S.players.find(p=>p.id===id);
function norm(){
S.players.forEach(p=>{if(!p.id)p.id=Date.now()+(_n++);KEYS.forEach(k=>{if(typeof p.s[k]!=="number")p.s[k]=0})});
if(!Array.isArray(S.court)||S.court.length!==5)S.court=[null,null,null,null,null];
S.court=S.court.map(id=>P(id)?id:null);
if(S.court.every(x=>!x))S.players.slice(0,5).forEach((p,i)=>S.court[i]=p.id);
if(!P(S.sel))S.sel=S.court.find(x=>x)||null;
if(!["live","roster","report"].includes(S.tab))S.tab="live";
if(S.fname==="إحصائيات البراعم")S.fname="junior stats";
S.subSlot=null;S.mode="+";
}
norm();
const pct=(a,b)=>b?Math.round(a/b*100)+"%":"-";
function totals(s){
  const m2=s.m2l+s.m2s,a2=m2+s.x2l+s.x2s,a3=s.m3+s.x3,aft=s.ftm+s.ftx,fgm=m2+s.m3,fga=a2+a3;
  return {pts:m2*2+s.m3*3+s.ftm,m2,a2,m3:s.m3,a3,ftm:s.ftm,aft,fgm,fga,reb:s.dr+s.or,to:s.tdt+s.ttr,as:s.as,st:s.st,pf:s.pf}
}
const H=["رقم","الاسم","نقاط","2 صح Layup","2 صح Shoot","2 غلط Layup","2 غلط Shoot","3 صح","3 غلط","حرة صح","حرة غلط","Dr","Or","Reb","As","St","Pf","Double Dribble","Travel","TO"];
const rowv=(n,nm,s)=>{const t=totals(s);return [n,nm,t.pts,s.m2l,s.m2s,s.x2l,s.x2s,s.m3,s.x3,s.ftm,s.ftx,s.dr,s.or,t.reb,s.as,s.st,s.pf,s.tdt,s.ttr,t.to]};
const teamS=()=>Object.fromEntries(KEYS.map(k=>[k,S.players.reduce((a,p)=>a+(p.s[k]||0),0)]));
const allRows=()=>{const r=S.players.map(p=>rowv(p.no,p.name,p.s));r.push(rowv("","الفريق",teamS()));return r};
const fname=()=>((S.fname||"").trim().replace(/[\\\/:*?"<>|]+/g,"-")||"إحصائيات");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function go(t){S.tab=t;S.subSlot=null;save();render()}
function selP(id){S.sel=id;S.subSlot=null;save();render()}
function setMode(m){S.mode=m;render()}
function bump(k){const p=P(S.sel);if(!p)return;p.s[k]=Math.max(0,p.s[k]+(S.mode==="-"?-1:1));save();render()}
function openSub(i){S.subSlot=S.subSlot===i?null:i;render()}
function doSub(id){S.court[S.subSlot]=id;S.sel=id;S.subSlot=null;save();render()}
function toBench(){S.court[S.subSlot]=null;if(S.sel&&!S.court.includes(S.sel))S.sel=S.court.find(x=>x)||null;S.subSlot=null;save();render()}
function addP(){
  const nm=document.getElementById("nm"),no=document.getElementById("no");
  if(!nm.value.trim()&&!no.value.trim())return;
  const p={id:Date.now(),name:nm.value.trim(),no:no.value.trim(),s:blank()};
  S.players.push(p);
  const e=S.court.indexOf(null);if(e>-1)S.court[e]=p.id;
  if(!S.sel)S.sel=p.id;
  save();render();
}
function edP(id,f,v){P(id)[f]=v.trim();save()}
function delP(id){if(!confirm("حذف اللاعب؟"))return;S.players=S.players.filter(p=>p.id!==id);S.court=S.court.map(x=>x===id?null:x);if(S.sel===id)S.sel=S.court.find(x=>x)||null;save();render()}
function rstP(id){if(!confirm("تصفير إحصائيات اللاعب؟"))return;P(id).s=blank();save();render()}
function rstAll(){if(!confirm("تصفير إحصائيات كل اللاعبين (بداية ماتش جديد)؟"))return;S.players.forEach(p=>p.s=blank());save();render()}

const PAD=[["m2l","2 صح","Layup","g"],["m2s","2 صح","Shoot","g"],["m3","3 نقاط","صح","g"],["x2l","2 غلط","Layup","r"],["x2s","2 غلط","Shoot","r"],["x3","3 نقاط","غلط","r"],["ftm","رمية حرة","صح","g"],["ftx","رمية حرة","غلط","r"],null,["dr","ريبوند","Dr دفاعي",""],["or","ريبوند","Or هجومي",""],["as","تمريرة","As",""],["st","سرقة","St",""],["pf","خطأ","Pf",""],["tdt","Turnover","Double Dribble",""],["ttr","Turnover","Travel",""]];

function live(){
  if(!S.players.length)return '<div class="card">روح على تبويب «اللاعبين» وضيف لاعبين الأول 👆</div>';
  let h='<div class="court">'+S.court.map((id,i)=>{
    const p=id&&P(id);
    if(!p)return `<div class="pc empty" onclick="openSub(${i})">+</div>`;
    const t=totals(p.s);
    return `<div class="pc ${S.sel===id?"sel":""}" onclick="selP(${id})"><div class="no">${esc(p.no)||"-"}</div><div class="nm">${esc(p.name)||"&nbsp;"}</div><div class="pt">${t.pts} ن · ${p.s.pf} خ</div><button class="sw" onclick="event.stopPropagation();openSub(${i})">⇄</button></div>`}).join("")+'</div>';
  if(S.subSlot!==null){
    const bench=S.players.filter(p=>!S.court.includes(p.id));
    h+=`<div class="sub"><h3>${S.court[S.subSlot]?"اختار البديل:":"اختار لاعب يدخل:"}</h3><div class="chips">`+
      (bench.length?bench.map(p=>`<button class="chip" onclick="doSub(${p.id})">${esc(p.no)} ${esc(p.name)}</button>`).join(""):'<span style="color:var(--mut);font-size:13px">مفيش لاعبين على الدكة</span>')+
      (S.court[S.subSlot]?'<button class="chip" onclick="toBench()">⬇ إخراج للدكة</button>':"")+'</div></div>';
  }
  const p=P(S.sel);
  h+=`<div class="mode"><button class="p ${S.mode==="+"?"on":""}" onclick="setMode('+')">➕ إضافة</button><button class="m ${S.mode==="-"?"on":""}" onclick="setMode('-')">➖ تصحيح</button></div>`;
  if(!p)return h+'<div class="card">اضغط على لاعب من الملعب علشان تسجل له.</div>';
  const t=totals(p.s);
  h+=`<div class="who">بتسجل لـ: <b>${esc(p.no)} ${esc(p.name)}</b> — ${t.pts} نقطة</div><div class="pad ${S.mode==="-"?"minus":""}">`+
    PAD.map(b=>b?`<button class="ab ${b[3]}" onclick="bump('${b[0]}')"><small>${b[1]}</small><span>${b[2]}</span><b>${p.s[b[0]]}</b></button>`:"<div></div>").join("")+'</div>';
  return h;
}
function roster(){
  let h='<div class="row"><input class="n" id="no" placeholder="رقم" inputmode="numeric"><input id="nm" placeholder="اسم اللاعب"><button class="btn" onclick="addP()">إضافة</button></div><div class="card">';
  h+=S.players.length?S.players.map(p=>`<div class="pl"><input class="n" value="${esc(p.no)}" onchange="edP(${p.id},'no',this.value)"><input class="m" value="${esc(p.name)}" onchange="edP(${p.id},'name',this.value)"><small>${S.court.includes(p.id)?"ملعب":"دكة"}</small><button class="chip" onclick="rstP(${p.id})">0️⃣</button><button class="chip" onclick="delP(${p.id})">🗑</button></div>`).join(""):"لسه مفيش لاعبين";
  return h+'</div><button class="btn g" style="width:100%" onclick="rstAll()">🔄 ماتش جديد (تصفير الكل)</button>';
}
function report(){
  if(!S.players.length)return '<div class="card">ضيف لاعبين الأول.</div>';
  const tt=totals(teamS());
  return `<div class="card"><div class="tot"><div><span>نقاط الفريق</span><strong>${tt.pts}</strong></div><div><span>نسبة التسديد</span><strong>${pct(tt.fgm,tt.fga)}</strong></div><div><span>ريبوند</span><strong>${tt.reb}</strong></div><div><span>Turnovers</span><strong>${tt.to}</strong></div></div></div>
  <div class="card scr"><table class="t"><tr>${H.map(x=>`<th>${x}</th>`).join("")}</tr>${allRows().map((r,i,a)=>`<tr class="${i===a.length-1?"tm":""}">${r.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</table></div>
  <div class="card"><div style="font-size:13px;color:var(--mut);margin-bottom:4px">اسم الملف (وعنوان التقرير)</div>
  <div class="row" style="margin-top:0"><input id="fn" value="${esc(S.fname)}" oninput="S.fname=this.value;save()"></div>
  <div class="row"><button class="btn" style="flex:2" onclick="exportPDF()">📄 حفظ PDF</button><button class="btn g" style="flex:1" onclick="printPDF()">🖨 طباعة</button></div></div>`;
}
function render(){
  document.getElementById("nav").innerHTML=[["live","🏀 الملعب"],["roster","👥 اللاعبين"],["report","📊 التقرير"]].map(([k,l])=>`<button class="${S.tab===k?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
  document.getElementById("view").innerHTML=S.tab==="live"?live():S.tab==="roster"?roster():report();
}
function printPDF(){
  const tt=totals(teamS());
  document.getElementById("rep").innerHTML=`<h1>${esc(S.fname)}</h1><div class="d">${new Date().toLocaleDateString("ar-EG")} — نسبة التسديد ${pct(tt.fgm,tt.fga)} | النقطتين ${pct(tt.m2,tt.a2)} | الثلاثية ${pct(tt.m3,tt.a3)} | الحرة ${pct(tt.ftm,tt.aft)}</div><table><tr>${H.map(h=>`<th>${h}</th>`).join("")}</tr>${allRows().map((r,i,a)=>`<tr class="${i===a.length-1?"tm":""}">${r.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</table>`;
  const old=document.title;document.title=fname();setTimeout(()=>{window.print();document.title=old},100);
}
function makePDF(jpgs,w,h){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=b=>{const u=typeof b==="string"?enc.encode(b):b;parts.push(u);len+=u.length};
  const obj=(n,fn)=>{offs[n]=len;push(n+" 0 obj\n");fn();push("\nendobj\n")};
  const n=jpgs.length,total=2+3*n;
  push("%PDF-1.4\n");
  obj(1,()=>push("<</Type/Catalog/Pages 2 0 R>>"));
  obj(2,()=>push(`<</Type/Pages/Count ${n}/Kids[${jpgs.map((_,i)=>(3+3*i)+" 0 R").join(" ")}]>>`));
  jpgs.forEach((jb,i)=>{
    const pg=3+3*i,c=pg+1,im=pg+2,s="q 842 0 0 595 0 0 cm /Im0 Do Q";
    obj(pg,()=>push(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 842 595]/Resources<</XObject<</Im0 ${im} 0 R>>>>/Contents ${c} 0 R>>`));
    obj(c,()=>push(`<</Length ${s.length}>>\nstream\n${s}\nendstream`));
    obj(im,()=>{push(`<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jb.length}>>\nstream\n`);push(jb);push("\nendstream")});
  });
  const x=len;push(`xref\n0 ${total+1}\n0000000000 65535 f \n`);
  for(let i=1;i<=total;i++)push(String(offs[i]).padStart(10,"0")+" 00000 n \n");
  push(`trailer\n<</Size ${total+1}/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`);
  return new Blob(parts,{type:"application/pdf"});
}
async function exportPDF(){
  if(!S.players.length){alert("ضيف لاعبين الأول");return}
  const tt=totals(teamS()),rows=allRows();
  const W=2200,HH=1556,M=40,RH=64,HDR=90,top=190,per=Math.floor((HH-top-HDR-30)/RH);
  const cw=[90,260].concat(Array(18).fill(98.3));
  const pages=[];
  for(let st=0;st<rows.length;st+=per){
    const cv=document.createElement("canvas");cv.width=W;cv.height=HH;
    const g=cv.getContext("2d");g.direction="rtl";g.textAlign="center";g.textBaseline="middle";
    g.fillStyle="#fff";g.fillRect(0,0,W,HH);g.fillStyle="#000";
    g.textAlign="right";g.font="bold 46px sans-serif";g.fillText(S.fname||"إحصائيات",W-M,60);
    g.font="26px sans-serif";g.fillStyle="#444";
    g.fillText(`${new Date().toLocaleDateString("ar-EG")}  |  التسديد ${pct(tt.fgm,tt.fga)}  |  النقطتين ${pct(tt.m2,tt.a2)}  |  الثلاثية ${pct(tt.m3,tt.a3)}  |  الحرة ${pct(tt.ftm,tt.aft)}`,W-M,120);
    g.textAlign="center";
    const cell=(i,y,h,txt,bg,font)=>{
      let xr=W-M;for(let k=0;k<i;k++)xr-=cw[k];
      g.fillStyle=bg;g.fillRect(xr-cw[i],y,cw[i],h);g.strokeStyle="#444";g.lineWidth=2;g.strokeRect(xr-cw[i],y,cw[i],h);
      g.fillStyle="#000";g.font=font;
      const ls=String(txt).split(" ");const lh=26;
      ls.forEach((l,j)=>g.fillText(l,xr-cw[i]/2,y+h/2+(j-(ls.length-1)/2)*lh));
    };
    H.forEach((h,i)=>cell(i,top,HDR,h,"#e9e9e9","bold 22px sans-serif"));
    rows.slice(st,st+per).forEach((r,j)=>{
      const last=(st+j===rows.length-1);
      r.forEach((v,i)=>cell(i,top+HDR+j*RH,RH,v,last?"#f0f0f0":"#fff",(last?"bold ":"")+"28px sans-serif"));
    });
    const b64=cv.toDataURL("image/jpeg",0.92).split(",")[1],bin=atob(b64),u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    pages.push(u);
  }
  const blob=makePDF(pages,W,HH),nm=fname()+".pdf";
  const file=new File([blob],nm,{type:"application/pdf"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:S.fname});return}
  }catch(e){if(e&&e.name==="AbortError")return}
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=nm;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
render();
(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const d=db.collection("data/users/"+id).doc("bara3em");
    const snap=await d.get();
    let localAt=0;try{localAt=+localStorage.getItem("bara3em_at")||0}catch(e){}
    if(snap.exists){
      const v=snap.data();
      if(v&&typeof v.json==="string"&&(v.at||0)>localAt){
        const x=JSON.parse(v.json);
        if(x&&Array.isArray(x.players)){Object.assign(S,x);norm();try{localStorage.setItem("bara3em",JSON.stringify(S));localStorage.setItem("bara3em_at",String(v.at))}catch(e){}render()}
      }else if(localAt>(v&&v.at||0)){await d.set({json:JSON.stringify(S),at:localAt})}
